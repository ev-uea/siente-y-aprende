{% extends "base.html" %}

{% block title %}{{ articulo.titulo }} - Siente y Aprende{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-sm border space-y-6">
    <a href="/" class="text-teal-600 hover:underline text-sm font-semibold">&larr; Volver al Inicio</a>

    <h1 class="text-3xl font-extrabold text-gray-900 leading-tight">{{ articulo.titulo }}</h1>
    <p class="text-gray-500 text-sm border-b pb-4">Publicado en Guías Pedagógicas de Siente y Aprende</p>

    <div class="prose max-w-none text-gray-700 leading-relaxed space-y-4 whitespace-pre-line">
        {{ articulo.contenido }}
    </div>

    <!-- Bloque Publicitario Sutil dentro del Artículo -->
    <div class="my-6 p-4 bg-gray-50 border border-gray-200 rounded-xl text-center">
        <span class="text-xs text-gray-400 block mb-1">Publicidad</span>
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-3776946834816103"
             data-ad-slot="1234567890"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
</div>
{% endblock %}
