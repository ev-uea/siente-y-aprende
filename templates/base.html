<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal de Recursos Gratuitos{% endblock %}</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SCRIPT OFICIAL DE GOOGLE ADSENSE -->
    <!-- Cuando Google te apruebe, descomentas esta línea y colocas tu cliente pub-XXXXXXXXXXXXXXXX -->
    <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- Encabezado Único -->
    <header class="bg-slate-900 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">

            <!-- Logo y Nombre -->
            <a href="/" class="flex items-center gap-3">
                <img src="{{ url_for('static', filename='img/logo.jpeg') }}"
                     alt="Logo Siente y Aprende"
                     class="h-10 w-auto object-contain rounded">
                <span class="text-2xl font-bold tracking-wide text-white">Siente y Aprende</span>
            </a>

            <!-- Menú de Navegación -->
            <nav class="flex items-center gap-6">
                <a href="/" class="hover:text-teal-400 font-medium transition">Inicio</a>
                <a href="/contacto" class="hover:text-teal-400 font-medium transition">Contacto</a>
            </nav>

        </div>
    </header>

    <!-- Bloque Publicitario Superior (AdSense Banner) -->
    <div class="container mx-auto my-4 px-4 text-center">
        <div class="bg-gray-200 border border-dashed border-gray-400 p-4 rounded-lg">
            <span class="text-xs text-gray-500 block mb-1">Publicidad</span>
            <!-- Espacio para banner AdSense: <ins class="adsbygoogle" ...></ins> -->
            <div class="h-16 flex items-center justify-center text-gray-400 text-sm font-semibold">
                [Espacio Anuncio Banner AdSense / Ad Manager]
            </div>
        </div>
    </div>

    <!-- Contenido Principal -->
    <main class="container mx-auto px-4 py-6 flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Pie de página con Enlaces Obligatorios para AdSense -->
    <footer class="bg-gray-900 text-gray-400 py-8 mt-12">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4 text-sm">
            <p>&copy; 2026 SienteyAprende. Todos los derechos reservados.</p>
            <div class="flex gap-6">
                <a href="/privacidad" class="hover:text-white">Política de Privacidad</a>
                <a href="/terminos" class="hover:text-white">Términos y Condiciones</a>
                <a href="/contacto" class="hover:text-white">Contacto</a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
